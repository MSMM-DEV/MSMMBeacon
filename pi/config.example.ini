; MSMM Beacon Timeclock — sample config.
; Copy to /etc/beacon-timeclock/config.ini and fill in the bearer + URL.

[device]
id            = pi-front-door
endpoint_url  = https://ggqlcsppojypgaiyhods.supabase.co/functions/v1/timeclock-punch
bearer_token  = REPLACE_WITH_TIMECLOCK_DEVICE_KEY

[reader]
; type can be 'pn532' (I2C/UART) or 'acr122u' (USB)
type          = pn532
i2c_bus       = 1
serial_port   =

[display]
; type: 'ssd1306' for the common 128x64 OLED, or 'none'
type          = ssd1306
i2c_addr      = 0x3C
width         = 128
height        = 64

[behavior]
debounce_sec  = 5
message_sec   = 3

[ui]
; mode: 'headless' = the OLED/LED daemon (timeclock.py, beacon-timeclock.service)
;       'kiosk'    = the 7" PyQt5 touchscreen app (kiosk.py, beacon-kiosk.service)
mode                 = kiosk
; Shown small on the idle screen, e.g. "Front Entrance".
location_label       = Front Entrance
; Seconds to wait for a category pick before returning to the idle clock
; (the interval keeps its rule-classified default if nobody picks).
category_timeout_sec = 25
; Seconds the "✓" confirmation / error screen stays up before idling.
confirm_sec          = 4
