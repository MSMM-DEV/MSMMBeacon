; MSMM Beacon Timeclock — sample config.
; Copy to /etc/beacon-timeclock/config.ini and fill in the bearer + URL.

[device]
id            = pi-front-door
endpoint_url  = https://ggqlcsppojypgaiyhods.supabase.co/functions/v1/timeclock-punch
bearer_token  = REPLACE_WITH_TIMECLOCK_DEVICE_KEY

[reader]
; type can be 'pn532' (I2C/UART) or 'acr122u' (USB)
type          = pn532
i2c_bus       = 1
serial_port   =

[display]
; type: 'ssd1306' for the common 128x64 OLED, or 'none'
type          = ssd1306
i2c_addr      = 0x3C
width         = 128
height        = 64

[behavior]
debounce_sec  = 5
message_sec   = 3
