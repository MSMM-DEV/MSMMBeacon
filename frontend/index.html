<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />

  <!-- Tab + address-bar tint. Matches the warm cream surface in light mode
       and the dark surface in dark mode so the chrome blends in. -->
  <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1B1917" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <title>MSMM Beacon</title>
  <meta name="description" content="MSMM's project pipeline, invoice tracker, and timekeeping system." />

  <!-- Favicons -->
  <link rel="icon"          type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon"          type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon"          type="image/svg+xml"           href="/icon-source.svg" />
  <link rel="shortcut icon"                                href="/favicon.ico" />

  <!-- PWA web app manifest (generated by vite-plugin-pwa at build) -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- iOS home-screen support (Safari does NOT read the W3C manifest icons
       for "Add to Home Screen", so apple-touch-icon is mandatory). -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable"            content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style"   content="default" />
  <meta name="apple-mobile-web-app-title"              content="Beacon" />
  <meta name="mobile-web-app-capable"                  content="yes" />
  <meta name="application-name"                        content="Beacon" />
  <meta name="format-detection"                        content="telephone=no" />

  <!-- Open-Graph for any link-share previews (in-app, Slack, etc.) -->
  <meta property="og:title"       content="MSMM Beacon" />
  <meta property="og:description" content="MSMM's project pipeline, invoice tracker, and timekeeping system." />
  <meta property="og:type"        content="website" />
  <meta property="og:image"       content="/icon-512.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
